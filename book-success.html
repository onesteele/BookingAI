<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking Confirmed!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <script src="./config.js"></script>
</head>
<body>
<div class="success-wrap">
  <div class="success-card">
    <div class="success-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <h1 style="font-size:22px; font-weight:700; color:var(--text); margin-bottom:6px;">You're confirmed!</h1>
    <p id="conf-email" style="font-size:13px; color:var(--text-2);">A calendar invite has been sent to your email.</p>

    <div class="success-details" id="details"></div>

    <p style="font-size:12px; color:var(--text-3); margin-bottom:16px;">
      Need to cancel or reschedule? Contact us directly.
    </p>

    <a id="book-again" href="#" class="btn btn-secondary w-full" style="justify-content:center;">Book Another Time</a>
  </div>
</div>

<script>
const p = new URLSearchParams(location.search)
const TZ = 'America/New_York'

function fmtTime(iso) {
  return new Date(iso).toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit', hour12:true, timeZone: TZ })
}
function fmtDate(iso) {
  return new Date(iso).toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric', timeZone: TZ })
}

const email = p.get('email') || ''
const start = p.get('start') || ''
const end   = p.get('end') || ''
const agent = p.get('agent') || ''
const slug  = p.get('slug') || ''
const meet  = p.get('meet') || ''

if (email) document.getElementById('conf-email').textContent = `A calendar invite has been sent to ${email}`
if (slug)  document.getElementById('book-again').href = `./book.html?slug=${encodeURIComponent(slug)}`

document.getElementById('details').innerHTML = `
  ${start ? `<div class="success-detail">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    ${fmtDate(start)}
  </div>` : ''}
  ${start && end ? `<div class="success-detail">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    ${fmtTime(start)} – ${fmtTime(end)} ET
  </div>` : ''}
  ${agent ? `<div class="success-detail">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    With ${agent}
  </div>` : ''}
  ${email ? `<div class="success-detail">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
    ${email}
  </div>` : ''}
  ${meet ? `<div class="success-detail">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 10l4.553-2.069A1 1 0 0 1 21 8.845v6.31a1 1 0 0 1-1.447.894L15 14"/><rect x="1" y="6" width="14" height="12" rx="2"/></svg>
    <a href="${meet}" target="_blank" rel="noopener" style="color:var(--gold); text-decoration:none;">Join Google Meet</a>
  </div>` : ''}
`
</script>
</body>
</html>
