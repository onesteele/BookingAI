<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Types — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../config.js"></script>
  <script src="../admin.js"></script>
</head>
<body>
<!-- Create/Edit Modal -->
<div class="modal-overlay hidden" id="modal-et">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-et-title">New Event Type</h2>
      <p>Configure how this meeting type appears and who handles it.</p>
    </div>
    <button class="modal-close" onclick="closeModal('modal-et')">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <form id="et-form" class="modal-form">
      <input type="hidden" id="et-id">
      <div class="form-group">
        <label for="et-name">Name</label>
        <input type="text" id="et-name" placeholder="30-min Onboarding Call" required>
      </div>
      <div class="two-col">
        <div class="form-group">
          <label for="et-duration">Duration (minutes)</label>
          <input type="number" id="et-duration" min="5" max="480" value="30" required>
        </div>
        <div class="form-group">
          <label for="et-buffer">Buffer (minutes)</label>
          <input type="number" id="et-buffer" min="0" max="120" value="5">
        </div>
      </div>
      <div class="form-group">
        <label for="et-location">Location / Link</label>
        <input type="text" id="et-location" placeholder="Zoom link, phone number, or address">
      </div>
      <div class="form-group">
        <label for="et-desc">Description</label>
        <textarea id="et-desc" placeholder="What happens during this meeting..." rows="2"></textarea>
      </div>
      <div class="form-group">
        <label>Color</label>
        <div class="color-picker" id="color-picker"></div>
        <input type="hidden" id="et-color" value="#4F46E5">
      </div>
      <div class="form-group">
        <label>Assigned Agents</label>
        <div class="agent-grid" id="agent-checkboxes"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal('modal-et')">Cancel</button>
        <button type="submit" class="btn btn-primary" id="btn-et-save" style="flex:1;">Create</button>
      </div>
    </form>
  </div>
</div>

<script>
const COLORS = ['#4F46E5','#0EA5E9','#10B981','#F59E0B','#EF4444','#8B5CF6','#EC4899','#14B8A6','#F97316','#6B7280']

;(async () => {
  const sb = await initAdmin()
  if (!sb) return

  const content = document.getElementById('page-content')
  content.innerHTML = `
    <div class="page-header">
      <div><h1>Event Types</h1><p>Configure meeting types and assign team members.</p></div>
      <button class="btn btn-primary" onclick="openCreate()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Event Type
      </button>
    </div>
    <div class="card" id="et-list"><div class="loading-center"><div class="spinner"></div></div></div>
  `

  // Define selectColor before it's first called
  window.selectColor = (color) => {
    document.getElementById('et-color').value = color
    document.querySelectorAll('.color-swatch').forEach(el => {
      el.classList.toggle('selected', el.dataset.color === color)
    })
  }

  // Render color swatches
  document.getElementById('color-picker').innerHTML = COLORS.map(c =>
    `<div class="color-swatch" style="background:${c}" onclick="selectColor('${c}')" data-color="${c}"></div>`
  ).join('')
  selectColor('#4F46E5')

  let agents = []
  const { data: agentData } = await sb.from('agents').select('id, name').order('name')
  agents = agentData || []

  async function loadETs() {
    const { data, error } = await sb.from('event_types').select('*').order('created_at')
    if (error) { document.getElementById('et-list').innerHTML = `<p class="empty-state">Error: ${error.message}</p>`; return }
    if (!data || data.length === 0) {
      document.getElementById('et-list').innerHTML = '<p class="empty-state">No event types yet. Create your first one.</p>'
      return
    }
    document.getElementById('et-list').innerHTML = data.map(et => `
      <div class="list-item">
        <div class="list-item-color-bar" style="background:${et.color}"></div>
        <div class="list-item-info">
          <div class="list-item-name">
            ${et.name}
            <span class="badge badge-gray">
              <svg style="width:10px;height:10px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              ${et.duration_minutes} min
            </span>
            ${!et.is_active ? '<span class="badge badge-yellow">Inactive</span>' : ''}
          </div>
          <div class="list-item-sub">${[et.location, et.description].filter(Boolean).join(' · ') || 'No description'}</div>
        </div>
        <div class="list-item-actions">
          <button class="btn btn-secondary btn-sm" onclick="toggleET('${et.id}', ${!et.is_active})">${et.is_active ? 'Deactivate' : 'Activate'}</button>
          <button class="btn btn-ghost btn-sm" onclick="openEdit('${et.id}')">Edit</button>
        </div>
      </div>
    `).join('')
  }

  await loadETs()

  window.openCreate = () => {
    document.getElementById('et-id').value = ''
    document.getElementById('et-name').value = ''
    document.getElementById('et-duration').value = 30
    document.getElementById('et-buffer').value = 5
    document.getElementById('et-location').value = ''
    document.getElementById('et-desc').value = ''
    selectColor('#4F46E5')
    document.getElementById('modal-et-title').textContent = 'New Event Type'
    document.getElementById('btn-et-save').textContent = 'Create'
    renderAgentCheckboxes([])
    openModal('modal-et')
  }

  window.openEdit = async (id) => {
    const { data: et } = await sb.from('event_types').select('*').eq('id', id).single()
    const { data: assigned } = await sb.from('event_type_agents').select('agent_id').eq('event_type_id', id)
    const assignedIds = (assigned || []).map(r => r.agent_id)

    document.getElementById('et-id').value = et.id
    document.getElementById('et-name').value = et.name
    document.getElementById('et-duration').value = et.duration_minutes
    document.getElementById('et-buffer').value = et.buffer_minutes
    document.getElementById('et-location').value = et.location || ''
    document.getElementById('et-desc').value = et.description || ''
    selectColor(et.color)
    document.getElementById('modal-et-title').textContent = 'Edit Event Type'
    document.getElementById('btn-et-save').textContent = 'Save Changes'
    renderAgentCheckboxes(assignedIds)
    openModal('modal-et')
  }

  function renderAgentCheckboxes(selectedIds) {
    document.getElementById('agent-checkboxes').innerHTML = agents.length === 0
      ? '<p class="text-xs text-gray">Add agents first.</p>'
      : agents.map(a => `
          <label class="agent-check">
            <input type="checkbox" name="agent" value="${a.id}" ${selectedIds.includes(a.id) ? 'checked' : ''}>
            ${a.name}
          </label>`).join('')
  }

  window.toggleET = async (id, newState) => {
    const { error } = await sb.from('event_types').update({ is_active: newState }).eq('id', id)
    if (error) { showToast('Error', error.message, true); return }
    await loadETs()
  }

  document.getElementById('et-form').onsubmit = async (e) => {
    e.preventDefault()
    const id       = document.getElementById('et-id').value
    const payload  = {
      name: document.getElementById('et-name').value.trim(),
      duration_minutes: Number(document.getElementById('et-duration').value),
      buffer_minutes:   Number(document.getElementById('et-buffer').value),
      location:    document.getElementById('et-location').value.trim() || null,
      description: document.getElementById('et-desc').value.trim()     || null,
      color:       document.getElementById('et-color').value,
      is_active:   true,
    }
    const btn = document.getElementById('btn-et-save')
    btn.disabled = true; btn.textContent = 'Saving...'

    let etId = id
    if (id) {
      const { error } = await sb.from('event_types').update(payload).eq('id', id)
      if (error) { showToast('Error', error.message, true); btn.disabled=false; btn.textContent='Save Changes'; return }
    } else {
      const { data, error } = await sb.from('event_types').insert(payload).select().single()
      if (error) { showToast('Error', error.message, true); btn.disabled=false; btn.textContent='Create'; return }
      etId = data.id
      // Initialize round-robin state
      await sb.from('round_robin_state').insert({ event_type_id: etId }).onConflict('event_type_id').ignore()
    }

    // Update agent assignments
    await sb.from('event_type_agents').delete().eq('event_type_id', etId)
    const checked = [...document.querySelectorAll('input[name="agent"]:checked')].map(el => ({
      event_type_id: etId, agent_id: el.value
    }))
    if (checked.length > 0) await sb.from('event_type_agents').insert(checked)

    closeModal('modal-et')
    showToast(id ? 'Event type updated' : 'Event type created')
    await loadETs()
    btn.disabled = false
    btn.textContent = id ? 'Save Changes' : 'Create'
  }
})()
</script>
</body>
</html>
