<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../config.js"></script>
  <script src="../admin.js"></script>
</head>
<body>
<script>
(async () => {
  const sb = await initAdmin()
  if (!sb) return

  const content = document.getElementById('page-content')
  content.innerHTML = `
    <div class="page-header">
      <div><h1>Dashboard</h1><p>Overview of your booking system</p></div>
    </div>
    <div class="stats-grid" id="stats">
      <div class="card stat-card"><div class="spinner" style="margin:auto;"></div></div>
    </div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;" id="panels"></div>
  `

  // Fetch data in parallel
  const today = new Date().toISOString().split('T')[0]
  const weekStart = new Date(); weekStart.setDate(weekStart.getDate() - weekStart.getDay()); weekStart.setHours(0,0,0,0)

  const [
    { data: bookings },
    { data: agents },
    { data: links },
  ] = await Promise.all([
    sb.from('bookings').select('id, status, start_time, customer_name, customer_email, agent:agents(name)').order('start_time', { ascending: false }),
    sb.from('agents').select('id, is_active'),
    sb.from('booking_links').select('id, slug, title, is_active').order('created_at', { ascending: false }),
  ])

  const confirmed = (bookings || []).filter(b => b.status === 'confirmed')
  const todayCount = confirmed.filter(b => b.start_time.startsWith(today)).length
  const weekCount  = confirmed.filter(b => new Date(b.start_time) >= weekStart).length
  const activeAgents = (agents || []).filter(a => a.is_active).length
  const activeLinks  = (links || []).filter(l => l.is_active).length

  document.getElementById('stats').innerHTML = `
    <div class="card stat-card">
      <div class="stat-icon indigo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
      <div><div class="stat-value">${todayCount}</div><div class="stat-label">Today's Bookings</div></div>
    </div>
    <div class="card stat-card">
      <div class="stat-icon blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg></div>
      <div><div class="stat-value">${weekCount}</div><div class="stat-label">This Week</div></div>
    </div>
    <div class="card stat-card">
      <div class="stat-icon green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
      <div><div class="stat-value">${activeAgents}</div><div class="stat-label">Active Agents</div></div>
    </div>
    <div class="card stat-card">
      <div class="stat-icon purple"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></div>
      <div><div class="stat-value">${activeLinks}</div><div class="stat-label">Booking Links</div></div>
    </div>
  `

  const baseUrl = CONFIG.appBaseUrl
  document.getElementById('panels').innerHTML = `
    <div class="card">
      <div class="card-body">
        <div class="flex justify-between items-center mb-16">
          <strong style="font-size:13px;">Recent Bookings</strong>
          <a href="./bookings.html" class="btn btn-link">View all</a>
        </div>
        ${confirmed.length === 0
          ? '<p class="text-sm text-gray" style="text-align:center; padding:20px 0;">No bookings yet.</p>'
          : confirmed.slice(0,5).map(b => `
            <div class="flex justify-between items-center" style="padding:8px 0; border-bottom:1px solid var(--gray-50);">
              <div>
                <div class="td-name">${b.customer_name}</div>
                <div class="td-sub">${fmtShort(b.start_time)} · ${fmtTime(b.start_time)}</div>
              </div>
              <span class="text-xs text-gray">${b.agent?.name || '—'}</span>
            </div>`).join('')
        }
      </div>
    </div>
    <div class="card">
      <div class="card-body">
        <div class="flex justify-between items-center mb-16">
          <strong style="font-size:13px;">Booking Links</strong>
          <a href="./links.html" class="btn btn-link">Manage</a>
        </div>
        ${(links || []).length === 0
          ? '<p class="text-sm text-gray" style="text-align:center; padding:20px 0;">No links yet.</p>'
          : (links || []).slice(0,5).map(l => `
            <div class="flex justify-between items-center" style="padding:8px 0; border-bottom:1px solid var(--gray-50);">
              <div style="min-width:0; flex:1;">
                <div class="td-name">${l.title || l.slug}</div>
                <div class="td-sub font-mono truncate">${baseUrl}/book.html?slug=${l.slug}</div>
              </div>
              <span class="badge ${l.is_active ? 'badge-green' : 'badge-gray'}" style="margin-left:8px;">${l.is_active ? 'Active' : 'Off'}</span>
            </div>`).join('')
        }
      </div>
    </div>
  `
})()

function fmtTime(iso) { return new Date(iso).toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit', hour12:true, timeZone:'America/New_York' }) }
function fmtShort(iso) { return new Date(iso).toLocaleDateString('en-US', { month:'short', day:'numeric' }) }
</script>
</body>
</html>
