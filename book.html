<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book a Meeting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="./config.js"></script>
</head>
<body>
<div class="booking-wrap">
  <div class="booking-card">

    <!-- Left: Event info -->
    <div class="booking-info" id="event-info">
      <div class="loading-center"><div class="spinner"></div></div>
    </div>

    <!-- Right: Booking flow -->
    <div class="booking-right">

      <!-- Step 1+2: Calendar + Time slots -->
      <div id="step-datetime">
        <div style="display:flex; gap:0; align-items:flex-start;">
          <!-- Calendar -->
          <div>
            <p style="font-size:10.5px; font-weight:700; color:var(--gold); text-transform:uppercase; letter-spacing:.07em; margin-bottom:14px;">Select a Date</p>
            <div class="cal-header">
              <button class="cal-btn" id="prev-month">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
              </button>
              <h3 id="cal-month-label"></h3>
              <button class="cal-btn" id="next-month">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
              </button>
            </div>
            <div class="cal-days-header">
              <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
            </div>
            <div class="cal-grid" id="cal-grid"></div>
          </div>

          <!-- Time slots -->
          <div class="slots-col" id="slots-col" style="display:none;">
            <h3 id="slots-date-label"></h3>
            <div class="slots-list" id="slots-list"></div>
          </div>
        </div>
      </div>

      <!-- Step 3: Booking form -->
      <div id="step-form" style="display:none;">
        <h2 style="font-size:14px; font-weight:600; color:var(--text); margin-bottom:18px;">Enter Your Details</h2>

        <div class="booking-summary" id="form-summary"></div>

        <form class="booking-form" id="booking-form">
          <div class="form-group">
            <label for="f-name">Your Name *</label>
            <input type="text" id="f-name" placeholder="Jane Smith" required>
            <span class="field-error" id="err-name"></span>
          </div>
          <div class="form-group">
            <label for="f-email">Email Address *</label>
            <input type="email" id="f-email" placeholder="jane@company.com" required>
            <span class="field-error" id="err-email"></span>
          </div>
          <div class="form-group">
            <label for="f-notes">Additional Notes</label>
            <textarea id="f-notes" placeholder="Anything you'd like us to know..." rows="3"></textarea>
          </div>
          <div style="display:flex; gap:10px; margin-top:4px;">
            <button type="button" class="btn btn-secondary" id="btn-back">
              <svg style="width:14px;height:14px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
              Back
            </button>
            <button type="submit" class="btn btn-primary" id="btn-submit" style="flex:1;">Confirm Booking</button>
          </div>
        </form>
      </div>

      <!-- Error state -->
      <div id="step-error" style="display:none; text-align:center; padding:40px 0;">
        <p style="color:var(--red); font-size:14px;" id="error-msg"></p>
      </div>

    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const sb = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey)
const slug = new URLSearchParams(location.search).get('slug')
const TZ = 'America/New_York'

let eventType = null
let bookingLink = null
let selectedDate = null   // Date object
let selectedSlot = null   // { start, end, spots_left }
let calYear, calMonth

// ─── Boot ───────────────────────────────────────────────────────────────────
async function boot() {
  if (!slug) { showError('No booking link specified.'); return }

  const { data, error } = await sb
    .from('booking_links')
    .select('*, event_type:event_types(*)')
    .eq('slug', slug)
    .eq('is_active', true)
    .single()

  if (error || !data) { showError('This booking link is invalid or no longer active.'); return }

  bookingLink = data
  eventType = data.event_type
  document.title = (data.title || eventType.name) + ' — Book a Meeting'

  renderInfo()
  initCalendar()
}

// ─── Info panel ──────────────────────────────────────────────────────────────
function renderInfo() {
  document.getElementById('event-info').innerHTML = `
    <div class="booking-info-bar" style="background:${eventType.color}"></div>
    <h1>${bookingLink.title || eventType.name}</h1>
    ${bookingLink.description ? `<p class="desc">${bookingLink.description}</p>` : ''}
    <div class="booking-meta">
      <div class="booking-meta-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        ${eventType.duration_minutes} minutes
      </div>
      ${eventType.location ? `
      <div class="booking-meta-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        ${eventType.location}
      </div>` : ''}
      <div class="booking-meta-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Google Calendar invite sent
      </div>
    </div>
    ${eventType.description ? `<p style="margin-top:16px; padding-top:14px; border-top:1px solid var(--gray-100); font-size:12px; color:var(--gray-400); line-height:1.6;">${eventType.description}</p>` : ''}
  `
}

// ─── Calendar ────────────────────────────────────────────────────────────────
function initCalendar() {
  const now = new Date()
  calYear = now.getFullYear()
  calMonth = now.getMonth()
  renderCalendar()
  document.getElementById('prev-month').onclick = () => { if (calMonth === 0) { calYear--; calMonth=11 } else calMonth--; renderCalendar() }
  document.getElementById('next-month').onclick = () => { if (calMonth === 11) { calYear++; calMonth=0 } else calMonth++; renderCalendar() }
}

function renderCalendar() {
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December']
  document.getElementById('cal-month-label').textContent = `${MONTHS[calMonth]} ${calYear}`

  const firstDay = new Date(calYear, calMonth, 1).getDay()
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate()
  const today = new Date(); today.setHours(0,0,0,0)

  let html = ''
  // Leading blanks
  for (let i = 0; i < firstDay; i++) html += `<button class="cal-day other-month" disabled></button>`
  // Days
  for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(calYear, calMonth, d)
    const isPast = date < today
    const isTod  = date.getTime() === today.getTime()
    const isSel  = selectedDate && date.getTime() === selectedDate.getTime()
    let cls = 'cal-day'
    if (isPast) cls += ' disabled'
    if (isTod)  cls += ' today'
    if (isSel)  cls += ' selected'
    const disabled = isPast ? 'disabled' : ''
    html += `<button class="${cls}" ${disabled} onclick="selectDate(${calYear},${calMonth},${d})">${d}</button>`
  }
  document.getElementById('cal-grid').innerHTML = html
}

async function selectDate(y, m, d) {
  selectedDate = new Date(y, m, d)
  selectedSlot = null
  renderCalendar()

  const col = document.getElementById('slots-col')
  col.style.display = 'block'

  const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday']
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December']
  document.getElementById('slots-date-label').textContent = `${DAYS[selectedDate.getDay()]}, ${MONTHS[m]} ${d}`
  document.getElementById('slots-list').innerHTML = '<div class="loading-center" style="padding:20px;"><div class="spinner"></div></div>'

  // Fetch available slots from edge function
  const { data, error } = await sb.functions.invoke('get-availability', {
    body: { slug, date: isoDate(selectedDate), timezone: TZ }
  })

  if (error || !data) {
    document.getElementById('slots-list').innerHTML = '<p style="font-size:13px;color:var(--gray-400);padding:12px 0;">Could not load times.</p>'
    return
  }

  const available = (data.slots || []).filter(s => s.spots_left > 0)
  if (available.length === 0) {
    document.getElementById('slots-list').innerHTML = '<p style="font-size:13px;color:var(--gray-400);padding:12px 0;">No available times on this date.</p>'
    return
  }

  document.getElementById('slots-list').innerHTML = available.map(slot => `
    <button class="slot-btn" onclick="selectSlot(${JSON.stringify(slot).replace(/"/g, '&quot;')})">
      ${fmtTime(slot.start)}
    </button>
  `).join('')
}

function selectSlot(slot) {
  selectedSlot = slot
  showForm()
}

// ─── Booking form ─────────────────────────────────────────────────────────────
function showForm() {
  document.getElementById('step-datetime').style.display = 'none'
  document.getElementById('step-form').style.display = 'block'

  document.getElementById('form-summary').innerHTML = `
    <div class="booking-summary-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      ${fmtDate(selectedSlot.start)}
    </div>
    <div class="booking-summary-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      ${fmtTime(selectedSlot.start)} – ${fmtTime(selectedSlot.end)} ET (${eventType.duration_minutes} min)
    </div>
    ${eventType.location ? `<div class="booking-summary-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      ${eventType.location}
    </div>` : ''}
  `
}

document.getElementById('btn-back').onclick = () => {
  document.getElementById('step-form').style.display = 'none'
  document.getElementById('step-datetime').style.display = 'block'
}

document.getElementById('booking-form').onsubmit = async (e) => {
  e.preventDefault()
  const name  = document.getElementById('f-name').value.trim()
  const email = document.getElementById('f-email').value.trim()
  const notes = document.getElementById('f-notes').value.trim()

  // Clear errors
  document.getElementById('err-name').textContent = ''
  document.getElementById('err-email').textContent = ''

  let valid = true
  if (!name)  { document.getElementById('err-name').textContent = 'Name is required'; valid = false }
  if (!email) { document.getElementById('err-email').textContent = 'Email is required'; valid = false }
  else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { document.getElementById('err-email').textContent = 'Enter a valid email'; valid = false }
  if (!valid) return

  const btn = document.getElementById('btn-submit')
  btn.disabled = true
  btn.textContent = 'Scheduling...'

  const { data, error } = await sb.functions.invoke('create-booking', {
    body: { slug, start_time: selectedSlot.start, customer_name: name, customer_email: email, notes: notes || undefined }
  })

  if (error || !data) {
    btn.disabled = false
    btn.textContent = 'Confirm Booking'
    alert(error?.message || 'Booking failed. The slot may no longer be available.')
    return
  }

  // Redirect to success page
  const params = new URLSearchParams({
    slug,
    name: data.booking.customer_name,
    email: data.booking.customer_email,
    start: data.booking.start_time,
    end: data.booking.end_time,
    agent: data.agent_name,
  })
  window.location.href = `./book-success.html?${params}`
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function showError(msg) {
  document.getElementById('step-datetime').style.display = 'none'
  document.getElementById('step-error').style.display = 'block'
  document.getElementById('error-msg').textContent = msg
}

function isoDate(date) {
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`
}
function fmtTime(iso) {
  return new Date(iso).toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit', hour12:true, timeZone: TZ })
}
function fmtDate(iso) {
  return new Date(iso).toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric', timeZone: TZ })
}

boot()
</script>
</body>
</html>
