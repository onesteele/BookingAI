<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connecting Calendar...</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../config.js"></script>
</head>
<body>
<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--gray-50); padding:24px;">
  <div class="card" style="max-width:360px; width:100%; padding:36px; text-align:center;">
    <div id="status-loading">
      <div class="spinner spinner-lg" style="margin:0 auto 20px;"></div>
      <p style="font-size:14px; color:var(--gray-600);">Connecting Google Calendar...</p>
    </div>
    <div id="status-success" style="display:none;">
      <div class="success-icon" style="margin:0 auto 16px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <h2 style="font-size:17px; font-weight:600; margin-bottom:6px;">Calendar Connected!</h2>
      <p style="font-size:13px; color:var(--gray-400);">Redirecting you back to agents...</p>
    </div>
    <div id="status-error" style="display:none;">
      <div style="width:56px;height:56px;border-radius:50%;background:#fee2e2;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
      </div>
      <h2 style="font-size:17px; font-weight:600; margin-bottom:6px;">Connection Failed</h2>
      <p id="error-msg" style="font-size:13px; color:var(--gray-400); margin-bottom:20px;"></p>
      <a href="../admin/agents.html" class="btn btn-secondary">Back to Agents</a>
    </div>
  </div>
</div>

<script>
async function handleCallback() {
  const params = new URLSearchParams(location.search)
  const code     = params.get('code')
  const agentId  = params.get('state')
  const errParam = params.get('error')

  function showError(msg) {
    document.getElementById('status-loading').style.display = 'none'
    document.getElementById('status-error').style.display  = 'block'
    document.getElementById('error-msg').textContent = msg
  }

  if (errParam) { showError(`Google denied access: ${errParam}`); return }
  if (!code || !agentId) { showError('Missing authorization code or state parameter.'); return }

  const sb = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey)
  const { error } = await sb.functions.invoke('google-auth-callback', {
    body: { code, agent_id: agentId }
  })

  if (error) { showError(error.message); return }

  document.getElementById('status-loading').style.display = 'none'
  document.getElementById('status-success').style.display = 'block'
  setTimeout(() => { window.location.href = '../admin/agents.html' }, 2000)
}

handleCallback()
</script>
</body>
</html>
