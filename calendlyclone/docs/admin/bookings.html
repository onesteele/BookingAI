<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookings — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../config.js"></script>
  <script src="../admin.js"></script>
</head>
<body>

<script>
;(async () => {
  const sb = await initAdmin()
  if (!sb) return

  // Filter state
  let filterAgent = ''
  let filterStatus = 'confirmed'

  // Load agents for filter dropdown
  const { data: agents } = await sb.from('agents').select('id, name').eq('is_active', true).order('name')

  const content = document.getElementById('page-content')
  content.innerHTML = `
    <div class="page-header">
      <div><h1>Bookings</h1><p>View and manage all scheduled appointments.</p></div>
    </div>
    <div class="card" style="margin-bottom:16px;">
      <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
        <div class="form-group" style="margin:0; flex:1; min-width:160px;">
          <select id="filter-agent" style="margin:0;">
            <option value="">All Agents</option>
            ${(agents || []).map(a => `<option value="${a.id}">${a.name}</option>`).join('')}
          </select>
        </div>
        <div class="form-group" style="margin:0; flex:1; min-width:140px;">
          <select id="filter-status" style="margin:0;">
            <option value="confirmed">Confirmed</option>
            <option value="cancelled">Cancelled</option>
            <option value="">All Statuses</option>
          </select>
        </div>
        <button class="btn btn-secondary btn-sm" onclick="applyFilters()">Filter</button>
      </div>
    </div>
    <div class="card" id="bookings-list"><div class="loading-center"><div class="spinner"></div></div></div>
  `

  async function loadBookings() {
    document.getElementById('bookings-list').innerHTML = '<div class="loading-center"><div class="spinner"></div></div>'

    let query = sb
      .from('bookings')
      .select('*, agent:agents(name, email), event_type:event_types(name, color, duration_minutes), booking_link:booking_links(slug)')
      .order('start_time', { ascending: false })
      .limit(200)

    if (filterAgent)  query = query.eq('agent_id', filterAgent)
    if (filterStatus) query = query.eq('status', filterStatus)

    const { data, error } = await query

    if (error) {
      document.getElementById('bookings-list').innerHTML = `<p class="empty-state">Error: ${error.message}</p>`
      return
    }
    if (!data || data.length === 0) {
      document.getElementById('bookings-list').innerHTML = '<p class="empty-state">No bookings found.</p>'
      return
    }

    document.getElementById('bookings-list').innerHTML = data.map(b => {
      const et = b.event_type
      const agent = b.agent
      const isCancelled = b.status === 'cancelled'
      return `
        <div class="list-item" style="${isCancelled ? 'opacity:0.6;' : ''}">
          ${et ? `<div class="list-item-color-bar" style="background:${et.color}"></div>` : ''}
          <div class="list-item-info">
            <div class="list-item-name">
              ${b.customer_name}
              <span class="badge ${isCancelled ? 'badge-gray' : 'badge-green'}">${b.status}</span>
              ${et ? `<span class="badge badge-indigo">${et.name}</span>` : ''}
            </div>
            <div class="list-item-sub">
              ${b.customer_email}
              &nbsp;·&nbsp;
              <strong>${fmtDate(b.start_time)}</strong> at <strong>${fmtTime(b.start_time)}</strong>
              ${agent ? `&nbsp;·&nbsp; Agent: ${agent.name}` : ''}
              ${b.notes ? `&nbsp;·&nbsp; <em>${b.notes}</em>` : ''}
            </div>
          </div>
          <div class="list-item-actions">
            ${!isCancelled ? `<button class="btn btn-ghost btn-sm" style="color:var(--red);" onclick="cancelBooking('${b.id}', '${(b.customer_name).replace(/'/g, "\\'")}')">Cancel</button>` : ''}
          </div>
        </div>
      `
    }).join('')
  }

  window.applyFilters = () => {
    filterAgent  = document.getElementById('filter-agent').value
    filterStatus = document.getElementById('filter-status').value
    loadBookings()
  }

  window.cancelBooking = async (id, name) => {
    if (!confirmAction(`Cancel booking for ${name}? This will also remove the Google Calendar event.`)) return

    const { data: { session } } = await sb.auth.getSession()
    const token = session?.access_token

    try {
      const res = await fetch(`${CONFIG.supabaseUrl}/functions/v1/cancel-booking`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`,
          'apikey': CONFIG.supabaseAnonKey,
        },
        body: JSON.stringify({ booking_id: id }),
      })
      const result = await res.json()
      if (!res.ok) throw new Error(result.error || 'Failed to cancel')
      showToast('Booking cancelled')
      await loadBookings()
    } catch (err) {
      showToast('Error', err.message, true)
    }
  }

  await loadBookings()
})()
</script>
</body>
</html>
