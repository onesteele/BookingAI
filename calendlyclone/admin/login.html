<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profit Insider — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../config.js"></script>
  <style>
    .login-wrap {
      background:
        radial-gradient(ellipse at 8% 50%, rgba(34,197,94,0.08) 0%, transparent 40%),
        radial-gradient(ellipse at 92% 50%, rgba(245,197,66,0.05) 0%, transparent 40%),
        #0a0a0a;
    }
    /* dot grid texture */
    .login-wrap::before {
      content: '';
      position: fixed; inset: 0; pointer-events: none;
      background-image: radial-gradient(circle, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 28px 28px;
    }
    .login-card {
      position: relative; z-index: 1;
    }
    .login-logo {
      text-align: center; margin-bottom: 36px;
    }
    .login-logo .logo-lockup {
      display: inline-flex; align-items: center; gap: 10px; margin-bottom: 28px;
    }
    .login-logo .logo-icon {
      width: 40px; height: 40px; background: var(--gold); border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .login-logo .logo-icon svg { width: 22px; height: 22px; color: #000; }
    .login-logo .logo-text { font-size: 20px; font-weight: 700; color: var(--gold); letter-spacing: -.01em; }
    .login-logo h1 { font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .login-logo p  { font-size: 13px; color: var(--text-2); }

    .login-form { display: flex; flex-direction: column; gap: 20px; }
    .login-input-wrap { display: flex; flex-direction: column; gap: 7px; }
    .login-input-wrap label {
      font-size: 10.5px; font-weight: 700; color: var(--gold);
      text-transform: uppercase; letter-spacing: .1em;
    }
    .login-input-wrap input {
      padding: 12px 14px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      color: #fff; font-size: 14px;
    }
    .login-input-wrap input:focus {
      border-color: var(--gold-border);
      box-shadow: 0 0 0 3px rgba(245,197,66,0.08);
      background: rgba(255,255,255,0.07);
    }
    .btn-login {
      width: 100%; height: 48px; border-radius: 14px;
      background: var(--gold); color: #000; font-size: 15px; font-weight: 700;
      border: none; cursor: pointer; margin-top: 4px;
      transition: background .15s, opacity .15s;
      letter-spacing: .01em;
    }
    .btn-login:hover { background: var(--gold-hover); }
    .btn-login:disabled { opacity: .4; pointer-events: none; }
    #login-error {
      display: none; font-size: 12px; color: #f87171;
      background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2);
      border-radius: 8px; padding: 8px 12px; margin-top: -8px;
    }
  </style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-lockup">
        <div class="logo-icon">
          <!-- Money bag / crown icon -->
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M9.5 3c.3-.7 1-1 1.5-1s1.2.3 1.5 1l.8 1.5H15a2 2 0 0 1 2 2v.8A3 3 0 0 1 15 10a7 7 0 1 1-6 0 3 3 0 0 1-2-2.7V6.5a2 2 0 0 1 2-2h1.7L9.5 3zM12 11a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm.75 2.5v.8c.6.2 1 .7 1 1.4 0 .9-.7 1.5-1.75 1.5-.9 0-1.5-.5-1.5-1.2h1c0 .2.2.3.5.3s.5-.1.5-.4-.2-.4-.8-.6C11.2 15 11 14.5 11 13.8c0-.7.5-1.3 1-.5v-.8h.75v.5z"/>
          </svg>
        </div>
        <span class="logo-text">Profit Insider</span>
      </div>
      <h1>Welcome Back</h1>
      <p>Sign in to continue your onboarding journey</p>
    </div>

    <form class="login-form" id="login-form">
      <div class="login-input-wrap">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="your@email.com" required autocomplete="email">
      </div>
      <div class="login-input-wrap">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <p id="login-error"></p>
      <button type="submit" class="btn-login" id="btn-login">Sign In</button>
    </form>
  </div>
</div>

<script>
const sb = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey)

sb.auth.getSession().then(({ data: { session } }) => {
  if (session) window.location.href = './index.html'
})

document.getElementById('login-form').onsubmit = async (e) => {
  e.preventDefault()
  const email    = document.getElementById('email').value.trim()
  const password = document.getElementById('password').value
  const btn      = document.getElementById('btn-login')
  const err      = document.getElementById('login-error')

  btn.disabled = true; btn.textContent = 'Signing in...'
  err.style.display = 'none'

  const { error } = await sb.auth.signInWithPassword({ email, password })

  if (error) {
    err.textContent = error.message
    err.style.display = 'block'
    btn.disabled = false; btn.textContent = 'Sign In'
  } else {
    window.location.href = './index.html'
  }
}
</script>
</body>
</html>
